<!doctype html><meta charset="utf-8"><title>Knome</title>
<style>html,body{height:100%;margin:0;background:#0f1412;color:#cfe9dc;font:16px system-ui,sans-serif}
body{display:grid;place-items:center;text-align:center}h1{letter-spacing:.35em;font-weight:600;margin:0 0 .6em}
p{opacity:.7;max-width:34em;margin:0 auto}.d{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#6fd3a5;animation:b 1s infinite}
.d:nth-child(2){animation-delay:.15s}.d:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}</style>
<div><h1>KNOME</h1><div><span class="d"></span><span class="d"></span><span class="d"></span></div><p id="msg" style="margin-top:1em">Starting your local AI ...</p></div>
